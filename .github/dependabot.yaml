# ============================================================================ #
#                        Dependabot Configuration File                         #
# ============================================================================ #
# This file defines the Dependabot configuration for this project. It keeps    #
# GitHub Actions up to date by opening pull requests on a weekly schedule.     #
#                                                                              #
# See: https://dependabot.com                                                  #
# ============================================================================ #

version: 2

updates:
  # Keep GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    open-pull-requests-limit: 5

    # Runs every Monday at 6:00 AM UTC
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"

    labels:
      - "Dependencies"

    commit-message:
      prefix: "chore"
      include: "scope"

    groups:
      github-actions:
        patterns:
          - "*"
