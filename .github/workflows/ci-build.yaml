# ============================================================================ #
#                                Build Workflow                                #
# ============================================================================ #
# Builds the C monorepo using CMake and Ninja on every push to dev and release #
# and on every pull request targeting either branch.                           #
#                                                                              #
# Skip tags (anywhere in commit message or PR title):                          #
#   [ci-skip]    - skips all workflows                                         #
#   [build-skip] - skips this workflow only                                    #
# ============================================================================ #

name: "CI: Build"

on:
  workflow_dispatch:
  push:
    branches: ["dev", "release"]
    paths:
      - "lab_*/**"
      - "src/**"
      - "include/**"
      - "**/CMakeLists.txt"
      - "CMakeLists.txt"
  pull_request:
    branches: ["dev", "release"]

concurrency:
  group: "build-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: "read"

jobs:
  # Check if the commit message / PR title contains skip tags
  check:
    name: "Skip Check"
    runs-on: "ubuntu-latest"
    outputs:
      should_skip: ${{ steps.belay.outputs.issued }}

    steps:
      - name: "Setup: Checkout repository"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: "Run: Check skip tags"
        id: "belay"
        uses: OctalMesh/belay-action@v1
        with:
          signal_tags: "[ci-skip],[build-skip]"

  # Compile all laboratory targets
  build:
    name: "Compile"
    needs: "check"
    if: needs.check.outputs.should_skip != 'true'
    runs-on: "ubuntu-latest"
    timeout-minutes: 15

    steps:
      - name: "Setup: Checkout repository"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: "Setup: Install build tools"
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc

      - name: "Setup: Configure CMake"
        run: "cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release"

      - name: "Run: Build all labs"
        run: "cmake --build build"
